name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t reserva-horas-medicas:1.0.0 .
      - name: Probar servicio
        run: |
          docker compose up -d --build
          sleep 5
          curl -fI http://localhost:8080
          docker compose down